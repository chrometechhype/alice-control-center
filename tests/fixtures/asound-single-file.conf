# Synthetic profile of firmware that keeps the whole ALSA chain in one read-only file — the layout
# reported for Станция Лайт 1, where /tmp/asound-vol.conf does not exist at all. Not a captured dump:
# the names here are the shape the route script must read, not a claim about any specific firmware.

pcm.!default {
  type asym
  playback.pcm "speaker_plug"
  capture.pcm "mic_array"
}

pcm.speaker_plug {
  type softvol
  min_dB -60.0
  slave.pcm "dmix_speaker"

  control {
    name "Speaker Playback Volume"
  }
}

pcm.mic_array {
  type plug
  slave.pcm "hw:0,1"
}

pcm.dmix_speaker {
  type dmix
  ipc_key 2048
  ipc_key_add_uid false
  ipc_perm 0666
  slave {
    pcm "hw:0,0"
    channels 2
    rate 48000
  }
}
