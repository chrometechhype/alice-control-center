pcm.!default {
  type asym
  playback.pcm "speakers"
  capture.pcm "multi_capture"
}

# must define transition speakers -> dmix_spk_plug
</tmp/asound-vol.conf>

pcm.multi_capture {
    type audio_metrics
    tap "capture"
    chunk_frames 1536
    slave.pcm "capture_fault_inject"
}

pcm.playback_metrics_tap {
  type audio_metrics
  tap "playback"
  chunk_frames 1536
  slave.pcm "dmix_spk_plug"
}

pcm.dmix_spk_plug {
  type plug
  slave.pcm "dmix_spk"
}

pcm.dmix_spk {
  type dmix
  ipc_key 1024
  ipc_key_add_uid false
  ipc_perm 0666
  slave {
    pcm "hw:0,0"
    channels 2
    rate 48000
    buffer_size 7680
    period_size 960
  }
}
