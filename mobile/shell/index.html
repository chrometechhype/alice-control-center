<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Alice Control Center</title>
    <style>
      * { box-sizing: border-box }
      body {
        margin: 0; min-height: 100vh; display: grid; place-content: center; gap: 14px;
        background: #14161a; color: #e8eaef; text-align: center;
        font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 24px;
      }
      .mark { width: 44px; height: 44px; margin: 0 auto; border-radius: 50%;
        border: 3px solid #2c313a; border-top-color: #7a5cff; animation: spin 1s linear infinite }
      @keyframes spin { to { transform: rotate(360deg) } }
      .done .mark { animation: none; border-color: #2f7d4f; border-top-color: #2f7d4f }
      h1 { font-size: 17px; font-weight: 600; margin: 0 }
      p { margin: 0; color: #9aa1ad; font-size: 13px; max-width: 34ch }
      button { display: none; margin: 4px auto 0; padding: 10px 18px; border: 0; border-radius: 10px;
        background: #7a5cff; color: #fff; font: 600 14px/1 inherit }
      .failed .mark { display: none }
      .failed button { display: block }
    </style>
  </head>
  <body>
    <div class="mark" aria-hidden="true"></div>
    <h1 id="title">Панель запускается</h1>
    <p id="note">Бэкенд поднимается внутри приложения. При первом запуске это несколько секунд.</p>
    <button id="retry" type="button">Попробовать снова</button>
    <script>
      // The panel itself is served by the node process on 127.0.0.1:8722, so this page has one job:
      // wait until that server answers and hand the whole WebView over to it. no-cors keeps the probe
      // alive without asking the backend for CORS headers — an opaque response still means "it answered".
      var BACKEND = 'http://127.0.0.1:8722/';
      var deadline = Date.now() + 60000;

      function fail() {
        document.body.className = 'failed';
        document.getElementById('title').textContent = 'Бэкенд не отвечает';
        document.getElementById('note').textContent =
          'Внутренний сервер панели не поднялся. Закройте приложение и откройте заново.';
      }

      function open() {
        document.body.className = 'done';
        window.location.replace(BACKEND);
      }

      function wait(ms) { return new Promise(function (r) { setTimeout(r, ms) }) }

      async function poll() {
        for (;;) {
          try {
            await fetch(BACKEND + 'api/health', { mode: 'no-cors', cache: 'no-store' });
            open();
            return;
          } catch (error) {
            if (Date.now() > deadline) { fail(); return }
            await wait(300);
          }
        }
      }

      document.getElementById('retry').addEventListener('click', function () {
        deadline = Date.now() + 60000;
        document.body.className = '';
        document.getElementById('title').textContent = 'Панель запускается';
        void poll();
      });

      void poll();
    </script>
  </body>
</html>
